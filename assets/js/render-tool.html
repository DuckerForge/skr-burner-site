<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<script type="module" src="model-viewer.min.js"></script>
<style>
  html,body{margin:0;padding:0;background:transparent;overflow:hidden}
  model-viewer{width:100vw;height:100vh;background:transparent;--poster-color:transparent}
</style>
</head>
<body>
<model-viewer id="mv" exposure="1.1" shadow-intensity="0" interaction-prompt="none"></model-viewer>
<script>
  const p = new URLSearchParams(location.search);
  const mv = document.getElementById('mv');
  mv.src = '../models/' + p.get('m');
  if (p.get('orbit')) mv.cameraOrbit = p.get('orbit');
  if (p.get('fov')) mv.fieldOfView = p.get('fov');
  mv.addEventListener('load', () => setTimeout(() => { document.title = 'READY'; }, 600));
</script>
</body>
</html>
